name: Supabase keep-alive

# Free-plan Supabase projects are paused after ~7 days without activity.
# This runs a tiny real query against both the DEV and PROD databases once
# a day so they stay awake until the app can move to a paid plan.
#
# Secrets (repo settings -> Secrets and variables -> Actions):
#   SUPABASE_DEV_URL, SUPABASE_DEV_ANON_KEY
#   SUPABASE_PROD_URL, SUPABASE_PROD_ANON_KEY
#
# Note: scheduled workflows only run from the default branch.

on:
  schedule:
    - cron: "17 9 * * *" # daily at 09:17 UTC (04:17 Central)
  workflow_dispatch: {}
  # Also run on PRs that change this file, so edits are verified before merge.
  pull_request:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            url_secret: SUPABASE_DEV_URL
            key_secret: SUPABASE_DEV_ANON_KEY
          - name: prod
            url_secret: SUPABASE_PROD_URL
            key_secret: SUPABASE_PROD_ANON_KEY
    name: ping ${{ matrix.name }}
    steps:
      - name: Query ${{ matrix.name }} database
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_ANON_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secrets for ${{ matrix.name }}"
            exit 1
          fi

          # A real table query (RLS returns an empty list for anon, which is fine:
          # Postgres still executes it, which is what counts as activity).
          # Retries cover the PostgREST schema-cache warm-up right after a restore.
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            --max-time 30 --retry 5 --retry-delay 30 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1")

          echo "REST status: $status"
          if [ "$status" != "200" ] && [ "$status" != "206" ]; then
            echo "::error::${{ matrix.name }} keep-alive query failed with HTTP $status"
            cat /tmp/body.json || true
            exit 1
          fi

          # Also touch the Auth service so the whole project registers activity.
          auth=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "Auth health status: $auth"
          echo "${{ matrix.name }} is awake ($(date -u +%FT%TZ))"
